<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6b5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="故障診断ナビ">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>故障診断ナビ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* 器具選定ナビと同じ色・文字。屋外でも読める高コントラスト、手袋でも押せる大きなボタン */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --ink:#15211f; --sub:#55635f; --line:#d5dcd9;
  --accent:#0b6b5c; --accent-ink:#ffffff; --accent-soft:#e2f1ed;
  --ok:#1f7a3a; --ok-soft:#e3f3e6; --warn:#9a5b00; --warn-soft:#fbefd9; --ng:#b3261e; --ng-soft:#fbe4e2;
  --code-bg:#eef2f1;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,"Consolas",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101615; --panel:#18211f; --ink:#e7eeec; --sub:#9fb0ab; --line:#2c3a37;
  --accent:#4fc2ab; --accent-ink:#06211c; --accent-soft:#163631;
  --ok:#6fd08a; --ok-soft:#173222; --warn:#f0b75a; --warn-soft:#3a2c12; --ng:#ff8a80; --ng-soft:#3d1c1a;
  --code-bg:#22302d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101615; --panel:#18211f; --ink:#e7eeec; --sub:#9fb0ab; --line:#2c3a37;
  --accent:#4fc2ab; --accent-ink:#06211c; --accent-soft:#163631;
  --ok:#6fd08a; --ok-soft:#173222; --warn:#f0b75a; --warn-soft:#3a2c12; --ng:#ff8a80; --ng-soft:#3d1c1a;
  --code-bg:#22302d; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -16px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;gap:10px;align-items:center}
header.top h1{font-size:18px;margin:0;letter-spacing:.02em}
header.top .scope{font-size:12px;color:var(--sub)}
header.top .sp{flex:1}
.progress{display:flex;gap:4px;margin:12px auto 0;max-width:640px}
.progress span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress span.done{background:var(--accent)}
.progress span.now{background:var(--accent);opacity:.45}
.phase{max-width:640px;margin:6px auto 0;font-size:12px;color:var(--sub);display:flex;justify-content:space-between;gap:8px}
main{max-width:640px;margin:12px auto 0;display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.card h2{font-size:20px;line-height:1.45;margin:0}
.card h3{font-size:14px;letter-spacing:.06em;margin:0;color:var(--sub)}
.lead{margin:0}
.muted{color:var(--sub);font-size:14px;margin:0}
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:17px;font-weight:700;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;min-height:56px}
.opt small{display:block;font-weight:400;font-size:13px;color:var(--sub);margin-top:2px}
.opt:hover{border-color:var(--accent)}
.opt:active{background:var(--accent-soft)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
details.help{background:var(--code-bg);border-radius:8px;padding:8px 12px;font-size:14px}
details.help summary{cursor:pointer;color:var(--accent);font-weight:700}
details.help p{margin:6px 0 0}
.btn{font:inherit;font-size:16px;border-radius:10px;padding:12px 16px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;font-weight:700;min-height:50px;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.btn.small{padding:6px 12px;font-size:14px;min-height:40px;border-width:1px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:grid;gap:10px}
.btns.two{grid-template-columns:1fr 1fr}
.linkbtn{font:inherit;font-size:14px;background:none;border:0;color:var(--sub);text-decoration:underline;cursor:pointer;padding:6px 0;justify-self:start}
.alert{border-radius:10px;padding:12px 14px;font-size:15px;border:1px solid;display:grid;gap:4px}
.alert.ok{background:var(--ok-soft);border-color:var(--ok)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn)}
.alert.ng{background:var(--ng-soft);border-color:var(--ng)}
.alert b{font-size:16px}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);justify-self:start}
.badge.ng{background:var(--ng-soft);color:var(--ng)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}
dl.kv dt{color:var(--sub)}
dl.kv dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
ol.trail{margin:0;padding-left:20px;font-size:14px;color:var(--sub);display:grid;gap:2px}
ol.trail b{color:var(--ink);font-weight:700}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.chk input{margin-top:3px;width:22px;height:22px;flex:none;accent-color:var(--accent)}
.chk.on{border-color:var(--accent);background:var(--accent-soft)}
label.f{display:grid;gap:4px;font-size:13px;color:var(--sub);min-width:0}
label.f>span b{color:var(--ink);font-weight:700}
label.f .req{color:var(--ng);font-weight:700;margin-left:4px}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
input.code{font-family:var(--f-code);letter-spacing:.02em}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bad{border-color:var(--ng)!important;background:var(--ng-soft)!important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lookup{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;background:var(--bg);color:var(--ink);position:relative}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.shots{display:grid;gap:10px}
.shot{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.shot b{font-size:15px}
.shot .n{font-size:13px;color:var(--sub)}
.thumbs{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.thumbs figure{margin:0;position:relative}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ng);color:#fff;font-size:14px;line-height:24px;padding:0;cursor:pointer}
.shot input[type=file]{display:none}
pre.sum{margin:0;white-space:pre-wrap;font-family:var(--f-body);font-size:14px;background:var(--code-bg);border-radius:8px;padding:12px;max-height:340px;overflow:auto}
.msg{font-size:14px;color:var(--sub);margin:0;min-height:1.4em}
.msg.err{color:var(--ng);font-weight:700}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center}
nav.bar .in{max-width:640px;width:100%;display:flex;gap:10px}
nav.bar .btn{flex:1}
nav.bar .btn.back{flex:0 0 auto;min-width:96px}
.stepname{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
@media (max-width:380px){.row2,.btns.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>故障診断ナビ</h1>
    <div class="scope">廣瀬電気｜照明の不点</div>
  </div>
  <div class="sp"></div>
  <button class="btn small ghost" id="btn-home" type="button">最初から</button>
</header>
<div class="progress" id="progress" aria-hidden="true"></div>
<div class="phase" id="phase"></div>
<main id="app" aria-live="polite"></main>
<nav class="bar" id="bar" hidden><div class="in">
  <button class="btn ghost back" id="btn-back" type="button">戻る</button>
  <button class="btn" id="btn-next" type="button">次へ</button>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KIGU_URL="https://hirosedenki.github.io/Kigu/";
const STAFF=["佐藤 吉政","大和田 亨","入駒 正廣","千田 文孝","益 憲一郎","平山 富康","名田部 憲二","近藤 陽介","田中 峻治","大塚 英治","神田 彩"];
const PHASES=["安全確認","症状","電源側","器具","結果","現調","送る"];

/* ===================== 診断フロー（文書「照明器具 不点診断フロー」STEP0〜5） ===================== */
// next は質問ID（n_）か結果ID（R_）。関数なら、それまでの回答（ctx）で行き先を決める。
const NODES={
  n_pcb:{phase:0,step:"STEP0 作業前の安全確認",q:"銘板の製造年は 1957〜1972年 ですか？",
    help:"この時期の古い安定器は、PCB（有害物質）を含むおそれがあります。該当する場合は器具に触れず、写真を撮って報告します。",
    opts:[{a:"いいえ（それ以外の年）",next:"n_smell"},{a:"はい（1957〜1972年製）",next:"R_PCB"},{a:"銘板が読めない",sub:"かなり古く見える器具は、先輩に確認してから触ります",next:"n_smell"}]},
  n_smell:{phase:1,step:"STEP1 症状",q:"焦げ臭い・煙・異音はありますか？",
    opts:[{a:"ない",next:"n_scope"},{a:"ある",sub:"ただちに回路を切ります",next:"R_BURN"}]},
  n_scope:{phase:1,step:"STEP1 症状",q:"点かないのは何台ですか？",
    help:"1台だけなら器具側、同じスイッチの複数台ならスイッチ・配線・タイマー・EEスイッチ、フロア全体なら分電盤・停電が多くなります。",
    opts:[{a:"1台だけ",set:{scope:"single"},next:"n_symptom"},{a:"同じスイッチ・回路の複数台",set:{scope:"multi"},next:"n_symptom"},{a:"フロアや建物全体",set:{scope:"all"},next:"n_outage"}]},
  n_symptom:{phase:1,step:"STEP1 症状",q:"どんな症状ですか？",
    opts:[{a:"全く点かない",next:"n_brk"},{a:"ちらつく・点滅する",next:"n_brk"},{a:"ランプの端が黒い",next:"n_brk"},{a:"点くまで時間がかかる",next:"n_brk"},{a:"しばらく点いて消える",next:"n_brk"}]},
  n_outage:{phase:1,step:"STEP1 症状",q:"建物全体や近所で停電していませんか？",
    opts:[{a:"停電している",next:"R_OUTAGE"},{a:"停電ではない",next:"n_brk"}]},
  n_brk:{phase:2,step:"STEP2 電源側の確認",q:"分電盤の、その回路のブレーカーはどうなっていますか？",
    opts:[{a:"入っている（ON）",next:c=>c.scope==="single"?"n_switch":"n_timer"},
          {a:"落ちている（OFF・中間の位置）",next:"n_reset"},
          {a:"漏電ブレーカーが落ちている",set:{elb:true},next:"n_reset"}]},
  n_reset:{phase:2,step:"STEP2 電源側の確認",q:"ブレーカーを入れ直すとどうなりますか？",
    help:"入れ直す前に、その回路の器具やコンセントに焦げ・水濡れなどの異常がないか確認します。",
    opts:[{a:"入って、照明も点いた",next:"R_TRIP_OK"},{a:"すぐにまた落ちる",next:"n_insul"},{a:"入らない・ハンドルが戻る・焼けや変色がある",next:"R_BRK"}]},
  n_insul:{phase:2,step:"STEP2 電源側の確認",q:"絶縁抵抗を測り、器具を1台ずつ切り離すとどうなりますか？",
    help:"回路を切った状態で、絶縁抵抗計で測定します。器具を外していき、どこで良くなるかを探します。",
    opts:[{a:"特定の器具を切り離すと落ちなくなる",next:"R_FIX_SHORT"},{a:"配線側の絶縁抵抗が低い",next:"R_WIRE_INSUL"},{a:"絶縁抵抗は良好なのに落ちる",next:"R_BRK"}]},
  n_timer:{phase:2,step:"STEP2 電源側の確認",q:"その回路にタイマーやEEスイッチ（自動点滅器）はありますか？",
    help:"外灯・看板灯・駐車場・共用部の照明によく使われています。盤の中や外壁を確認します。",
    opts:[{a:"タイマーがある",sub:"EEスイッチもある場合も、まずタイマーから",next:"n_tm1"},{a:"EEスイッチだけある",next:"n_ee1"},{a:"どちらもない・見当たらない",next:"n_switch"}]},
  n_tm1:{phase:2,step:"STEP2 タイマーの点検",q:"タイマーの時刻・曜日・入切の設定は合っていますか？",
    help:"停電のあとに時刻がずれていないかも確認します。",
    opts:[{a:"設定違い・時刻のずれがあった",next:"R_TM_SET"},{a:"設定は合っている",next:"n_tm2"}]},
  n_tm2:{phase:2,step:"STEP2 タイマーの点検",q:"タイマーを手動の「入」に切り替えると点きますか？",
    opts:[{a:"点く",sub:"設定は合っているのに自動で入らない",next:"R_TM"},{a:"点かない",next:"n_tm3"}]},
  n_tm3:{phase:2,step:"STEP2 タイマーの点検",q:"タイマーの入力側と出力側の電圧はどうですか？（手動「入」の状態）",
    opts:[{a:"入力はあるのに、出力が出ない",next:"R_TM"},{a:"出力も出ている",sub:"タイマーは正常。この先を調べます",next:"n_ee_q"},{a:"入力側に電圧がない",next:"R_WIRE"}]},
  n_ee_q:{phase:2,step:"STEP2 EEスイッチの点検",q:"その回路にEEスイッチもありますか？",
    opts:[{a:"ある",next:"n_ee1"},{a:"ない",next:"n_switch"}]},
  n_ee1:{phase:2,step:"STEP2 EEスイッチの点検",q:"EEスイッチの受光部を手や黒い布で覆って暗くすると点きますか？",
    help:"点くまで数分かかる機種があります。電源を入れ直すと約30秒点灯する機種（パナソニックEE6153など）もあります。",
    opts:[{a:"しばらくすると点く",next:"n_ee2"},{a:"覆っても点かない",next:"n_ee3"}]},
  n_ee2:{phase:2,step:"STEP2 EEスイッチの点検",q:"受光部の汚れ・破損や、近くの照明・看板の光が当たっていませんか？",
    opts:[{a:"汚れ・破損・光の当たりがある",next:"R_EE_ADJ"},{a:"特に問題はない",sub:"暗くなっても反応が鈍い",next:"R_EE"}]},
  n_ee3:{phase:2,step:"STEP2 EEスイッチの点検",q:"EEスイッチの入力側と出力側の電圧はどうですか？（受光部を覆った状態）",
    opts:[{a:"入力はあるのに、出力が出ない",next:"R_EE"},{a:"出力も出ている",sub:"EEスイッチは正常。この先を調べます",next:"n_switch"},{a:"入力側に電圧がない",next:"R_WIRE"}]},
  n_switch:{phase:2,step:"STEP2 電源側の確認",q:"壁のスイッチを操作するとどうですか？",
    help:"3路・4路スイッチ、リモコンスイッチの回路は、別の場所のスイッチでも試します。",
    opts:[{a:"普通に操作でき、感触も正常",next:"n_volt"},{a:"感触がおかしい・焼けや変色がある",next:"R_SW"}]},
  n_volt:{phase:2,step:"STEP2 電源側の確認",q:"スイッチを入れた状態で、器具の電源端子に定格電圧（100Vまたは200V）が来ていますか？",
    help:"活線での測定になります。テスターのレンジと、絶縁手袋などの保護具を確認してから測ります。",
    opts:[{a:"来ている",sub:"器具側の故障です",next:"n_type"},{a:"来ていない",next:"n_volt_where"}]},
  n_volt_where:{phase:2,step:"STEP2 電源側の確認",q:"電圧はどこで途切れていますか？",
    opts:[{a:"スイッチの入口はあるが、出口にない",next:"R_SW"},{a:"スイッチからは出ているが、器具まで来ない",next:"R_WIRE"},{a:"ブレーカーの2次側から出ていない",next:"R_BRK"}]},
  n_type:{phase:3,step:"STEP3 器具の種類",q:"器具の種類はどれですか？",
    help:"ランプの表示と銘板で見分けます。わからない場合は、ランプと銘板の写真を撮って先輩に送ります。",
    opts:[{a:"直管蛍光灯（グロー式）",sub:"FL40S など。点灯管が付いている",set:{type:"直管蛍光灯（グロー式）"},next:"n_fl1"},
          {a:"直管蛍光灯（ラピッド式・インバーター式）",sub:"FLR40S・FHF32 など",set:{type:"直管蛍光灯（ラピッド式・インバーター式）"},next:"n_flr"},
          {a:"コンパクト形蛍光灯",sub:"FPL・FHT など。ダウンライトに多い",set:{type:"コンパクト形蛍光灯"},next:"n_flr"},
          {a:"HID（水銀灯・メタハラ・高圧ナトリウム）",sub:"HF400X など。工場・倉庫の高天井、外灯",set:{type:"HID"},next:"n_hid1"},
          {a:"LED一体型器具",sub:"ランプが外せない",set:{type:"LED一体型器具"},next:"R_LED"},
          {a:"直管LEDランプ",sub:"既存の器具にLEDランプを入れている",set:{type:"直管LEDランプ"},next:"R_LEDTUBE"},
          {a:"非常灯・誘導灯",sub:"充電モニタ・点検スイッチがある",set:{type:"非常灯・誘導灯"},next:"n_em1"},
          {a:"電球形（白熱・ハロゲン・LED電球）",sub:"E26・E17の口金",set:{type:"電球形"},next:"n_bulb"},
          {a:"センサー・調光付き",sub:"センサー部や調光器がある",set:{type:"センサー・調光付き"},next:"n_sensor1"}]},
  n_fl1:{phase:3,step:"STEP4 直管蛍光灯（グロー式）",q:"点灯管（グロー）を正常品に替えると点きますか？",

function resolveNext(opt){ return typeof opt.next==="function"?opt.next(S.ctx):opt.next; }
function answer(i){
  const n=NODES[S.node], o=n.opts[i];
  S.trail.push({node:S.node,q:n.q,a:o.a,ctx:JSON.parse(JSON.stringify(S.ctx))});
  if(o.set) Object.assign(S.ctx,o.set);
  const nx=resolveNext(o);
  if(nx.startsWith("R_")){ setResult(nx); go("result"); }
  else { S.node=nx; save(); renderQ(); window.scrollTo({top:0}); }
}
function setResult(id){ if(S.result!==id){ S.result=id; const k=RESULTS[id].kind; S.survey=prefill(k,S.survey); } save(); }
function prefill(kind,old){
  // 種類を答えていれば、色温度などの初期値に使う。前の入力は同じ項目だけ引き継ぐ
  const keep={}; const ids=new Set((SURVEY[kind]||[]).map(f=>f.id));
  for(const k in old) if(ids.has(k)) keep[k]=old[k];
  if((kind==="timer"||kind==="ee")&&!keep.maker) keep.maker="パナソニック";
  if(kind==="fixture"&&!keep.shape){ const t=S.ctx.type||""; if(t==="HID") keep.shape="高天井（HID）"; if(t==="非常灯・誘導灯") keep.shape="非常灯"; }
  if(S.ctx.elb&&kind==="breaker"&&!keep.bkind) keep.bkind="漏電ブレーカー（分岐）";
  return keep;
}
function back(){
  if(S.screen==="q"){
    if(!S.trail.length) return go("safety");
    const t=S.trail.pop(); S.node=t.node; S.ctx=t.ctx; save(); renderQ(); return;
  }
  if(S.screen==="result"){ if(S.trail.length){ const t=S.trail.pop(); S.node=t.node; S.ctx=t.ctx; } S.result=null; go("q"); return; }
  if(S.screen==="survey") return go("result");

}

  let inp;

  else inp=`<input type="text" ${f.type==="code"?'class="code" autocapitalize="characters" autocomplete="off" spellcheck="false"':""} data-f="${f.id}" value="${esc(v||"")}" placeholder="${esc(f.ph||"")}">`;

function validate(fields){
  for(const f of fields){
    if(!f.req) continue;
    const v=S.survey[f.id];
    if(f.id==="model"&&S.survey.unreadable) continue;

function renderShots(list){
  const box=$("shots");
  box.innerHTML=list.map((name,i)=>{ const arr=photos[name]||[];

  });

// 送りやすいように長い辺1600pxのJPEGにする
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,ng)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ng; i.src=url; });
    const max=1600, s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise((ok,ng)=>c.toBlob(b=>b?ok(b):ng(new Error("jpeg")),"image/jpeg",0.82));
  } finally { URL.revokeObjectURL(url); }
}

    if(Array.isArray(v)) v=v.join("・");
    if(v===undefined||v===null||String(v).trim()==="") continue;
    out.push([f.label,String(v).trim()+(f.unit&&f.type==="num"?f.unit:"")]);
  }
  return out;
}
function photoList(){ const r=RESULTS[S.result]; const out=[]; let n=1;
  for(const name of PHOTOS[r.kind]) for(const p of (photos[name]||[])) out.push({name,blob:p.blob,file:`${String(n++).padStart(2,"0")}_${name.replace(/[\\/:*?"<>|（）・\s]/g,"")}.jpg`});

      <label class="f" style="grid-column:1/-1"><span><b>件名</b></span><input type="text" data-i="title" value="${esc(i.title||"")}" placeholder="例：照明器具 不点修理"></label>
      <label class="f"><span><b>当社担当者</b></span><select data-i="staff"><option value="">選んでください</option>${STAFF.map(n=>`<option${i.staff===n?" selected":""}>${esc(n)}</option>`).join("")}</select></label>
      <label class="f"><span><b>依頼先担当者</b></span><input type="text" data-i="contact" value="${esc(i.contact||"")}" placeholder="例：総務 山田様"></label>
      <label class="f"><span><b>作成日</b></span><input type="text" data-i="date" value="${esc(i.date||today())}"></label>
    </div>
  </section>
  <section class="card">
    <h3>送る内容</h3>
    <pre class="sum" id="sum"></pre>
    <div class="btns">
      ${quote?`<button class="btn" id="o-make" type="button">見積り試算表を作る</button>`:""}
      <button class="btn${quote?" ghost":""}" id="o-share" type="button">LINE WORKSなどで送る</button>
      <button class="btn ghost" id="o-copy" type="button">文章だけコピー</button>
    </div>
    <p class="msg" id="o-msg"></p>
    ${quote?`<p class="muted">エクセルには品名・型番・数量・備考と現調メモが入ります。単価・歩掛は事務所で入れてください。</p>`:""}
  </section>
  <section class="card">
    <button class="btn ghost" id="o-new" type="button">次の診断をはじめる</button>
  </section>`;
  const upd=()=>{ $("sum").textContent=summaryText(); };
  upd();
  $("app").querySelectorAll("[data-i]").forEach(el=>el.addEventListener(el.tagName==="SELECT"?"change":"input",()=>{ S.info[el.dataset.i]=el.value; if(el.dataset.i==="staff"){ try{ localStorage.setItem("shindan-staff",el.value); }catch(e){} } save(); upd(); lastXlsx=null; }));
  const msg=(t,err)=>{ const m=$("o-msg"); m.textContent=t; m.classList.toggle("err",!!err); };
  if(quote) $("o-make").onclick=async()=>{
    const b=$("o-make"); b.disabled=true; msg("エクセルを作っています…");
    try{ const f=await makeFile(); download(f); msg("ダウンロードしました。「LINE WORKSなどで送る」で写真と一緒に送れます。"); }
    catch(e){ msg("作れませんでした："+(e&&e.message||"不明なエラー"),true); }
    finally{ b.disabled=false; }
  };
  $("o-share").onclick=async()=>{
    const text=summaryText(); const files=[];
    try{ if(quote) files.push(await makeFile()); }catch(e){ msg("エクセルを作れませんでした："+(e&&e.message||""),true); return; }
    for(const p of photoList()) files.push(new File([p.blob],p.file,{type:"image/jpeg"}));
    if(!navigator.share){ await copyText(text); if(files[0]&&quote) download(files[0]); msg("この端末では直接送れません。文章をコピーし、エクセルをダウンロードしました。LINE WORKSに貼り付けて添付してください。"); return; }
    try{
      if(files.length&&navigator.canShare&&navigator.canShare({files})) await navigator.share({files,title:`故障診断 ${RESULTS[S.result].title}`,text});
      else if(files.length&&navigator.canShare&&quote&&navigator.canShare({files:[files[0]]})){ await navigator.share({files:[files[0]],title:"故障診断",text}); msg("写真が多くて一緒に送れなかったため、エクセルだけ送りました。写真は別に送ってください。"); return; }
      else await navigator.share({title:"故障診断",text});
      msg("送る画面を開きました。");
    }catch(e){ if(e&&e.name==="AbortError") return; await copyText(text); msg("送れませんでした。文章をコピーしたので、LINE WORKSに貼り付けてください。",true); }
  };
  $("o-copy").onclick=async()=>{ msg(await copyText(summaryText())?"コピーしました。":"コピーできませんでした。上の文章を長押しして選んでください。"); };
  $("o-new").onclick=()=>{ if(!confirmNew()) return; const staff=S.info.staff; S=fresh(); S.info.staff=staff; for(const k in photos){ photos[k].forEach(p=>URL.revokeObjectURL(p.url)); delete photos[k]; } go("safety"); };
  setBar(back,null);
}
function confirmNew(){ const n=photoList().length; return n===0||window.confirm(`撮った写真（${n}枚）は消えます。送り終わりましたか？`); }
function download(file){ const url=URL.createObjectURL(file); const a=document.createElement("a"); a.href=url; a.download=file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000); }

/* ===================== 見積り試算表（雛形にセルだけ書き込む：他社見積り変換アプリと同じ方式） ===================== */
let lastXlsx=null;
async function makeFile(){
  const blob=await buildXlsx();
  const d=new Date(), ymd=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  const name=(S.info.title||S.info.site||RESULTS[S.result].title).replace(/[\\/:*?"<>|]/g,"").slice(0,40);
  return new File([blob],`見積り試算表_${name}_${ymd}.xlsx`,{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function rowsFor(){
  const r=RESULTS[S.result], s=S.survey, q=Number(s.qty)||1;
  const old=s.unreadable?"既設 型番不明（写真参照）":(s.model?`既設 ${s.model}`:"");
  const price=s.price!==undefined&&s.price!==""&&!isNaN(Number(s.price))?Number(s.price):null;
  const join=(...a)=>a.filter(x=>x!==undefined&&x!==null&&String(x).trim()!=="").join(" ");
  // 規格は「メーカー)型番」の形にする（メーカーが不明・その他のときは型番だけ）
  const mk=m=>m&&!["その他","不明"].includes(m)?m+")":"";
  const spec=(maker,model,none)=>model?mk(maker)+model:mk(maker)+none;
  const rows=[];
  const scaffold=()=>{ if(s.scaffold==="高所作業車") rows.push({A:"高所作業車",C:1,D:"日"}); if(s.scaffold==="ローリングタワー") rows.push({A:"ローリングタワー",C:1,D:"式"}); };
  switch(r.kind){
    case "fixture":{
      const led=S.ctx.type==="HID"||s.shape==="高天井（HID）"||s.shape==="投光器"?"LED高天井器具・投光器":"LED照明器具";
      rows.push({A:led+(s.shape?`（${s.shape}）`:""),B:spec(s.newMaker||s.maker,s.newModel,"器具選定ナビで選定"),C:q,D:"台",J:old,L:price});
      rows.push({A:"既設照明器具撤去",C:q,D:"台"});
      const disp=(s.disposal||[]).filter(x=>x!=="PCBの疑い");
      if(disp.length) rows.push({A:"撤去品処分",B:disp.join("・"),C:1,D:"式"});
      scaffold(); break; }
    case "timer": rows.push({A:"タイムスイッチ",B:spec(s.maker,s.newModel,"後継品を確認"),C:q,D:"台",J:old,L:price}); break;
    case "ee": rows.push({A:"EEスイッチ（自動点滅器）",B:spec(s.maker,s.newModel,"後継品を確認"),C:q,D:"台",J:old,L:price}); break;
    case "breaker": rows.push({A:s.bkind||"ブレーカー",B:spec(s.maker,s.newModel,"後継品を確認"),C:q,D:"個",J:old,L:price}); break;
    case "battery": rows.push({A:"非常灯・誘導灯用 交換電池",B:spec(s.maker,s.newModel||s.battModel,"型番を確認"),C:q,D:"個",J:old,L:price}); scaffold(); break;
    case "switch": rows.push({A:`スイッチ（${s.swkind||"種類確認"}）`,B:spec(s.maker,s.newModel,"型番を確認"),C:q,D:"個",J:old,L:price}); break;
    case "wiring": rows.push({A:"配線補修",B:join(s.wire,s.route),C:Number(s.length)||1,D:s.length?"m":"式",J:s.section||""}); scaffold(); break;
    case "bulb": rows.push({A:"LED電球",B:join(s.base,s.watt,s.cct,s.dim==="調光あり（調光対応品が必要）"?"調光対応":""),C:q,D:"個"}); break;
  }
  return rows;
}
function memoLines(){
  const r=RESULTS[S.result]; const L=["【現調メモ（故障診断ナビ）】",`診断結果：${r.title}`,`故障箇所：${r.part}`];
  if(S.ctx.type) L.push(`器具の種類：${S.ctx.type}`);
  L.push(`対応方針：${r.policy}`); if(r.alt) L.push(`別の案：${r.alt}`);
  for(const [k,v] of surveyLines()) L.push(`${k}：${v}`);
  L.push(`写真：${photoList().length}枚（LINE WORKSで送付）`);
  return L;
}
const colNum=s=>[...s].reduce((a,c)=>a*26+c.charCodeAt(0)-64,0);
async function buildXlsx(){
  if(!window.JSZip) throw new Error("エクセル作成の部品を読み込めませんでした。電波のよい場所でもう一度開いてください。");
  const b64=($("tpl-xlsx")||{}).textContent||""; if(!b64.trim()) throw new Error("見積り試算表の雛形が見つかりません。");
  const zip=await JSZip.loadAsync(b64.trim(),{base64:true});
  const sheetPath="xl/worksheets/sheet1.xml";
  const doc=new DOMParser().parseFromString(await zip.file(sheetPath).async("string"),"application/xml");
  const NS=doc.documentElement.namespaceURI;
  const sheetData=doc.getElementsByTagNameNS(NS,"sheetData")[0];
  const rowMap=new Map(); for(const r of sheetData.getElementsByTagNameNS(NS,"row")) rowMap.set(Number(r.getAttribute("r")),r);
  const colStyle={}; for(const c of doc.getElementsByTagNameNS(NS,"col")){ for(let i=+c.getAttribute("min");i<=Math.min(+c.getAttribute("max"),40);i++) if(c.getAttribute("style")) colStyle[i]=c.getAttribute("style"); }
  function cell(ref){
    const m=/^([A-Z]+)(\d+)$/.exec(ref), col=colNum(m[1]), rn=Number(m[2]);
    let row=rowMap.get(rn);
    if(!row){ row=doc.createElementNS(NS,"row"); row.setAttribute("r",rn);
      let after=null; for(const [k,el] of rowMap){ if(k>rn&&(!after||k<after[0])) after=[k,el]; }
      sheetData.insertBefore(row,after?after[1]:null); rowMap.set(rn,row); }
    const mk=()=>{ const c=doc.createElementNS(NS,"c"); c.setAttribute("r",ref);
      const s=row.getAttribute("customFormat")==="1"?row.getAttribute("s"):colStyle[col]; if(s) c.setAttribute("s",s); return c; };
    for(const c of row.getElementsByTagNameNS(NS,"c")){
      const cc=colNum(c.getAttribute("r").replace(/\d+/g,""));
      if(cc===col) return c;
      if(cc>col){ const n=mk(); row.insertBefore(n,c); return n; }
    }
    const n=mk(); row.appendChild(n); return n;
  }
  const clear=c=>{ while(c.firstChild) c.removeChild(c.firstChild); c.removeAttribute("t"); };
  const add=(p,tag,text)=>{ const e=doc.createElementNS(NS,tag); if(text!==undefined) e.textContent=text; p.appendChild(e); return e; };
  const setStr=(ref,s)=>{ const c=cell(ref); clear(c); if(s===""||s===null||s===undefined) return; c.setAttribute("t","inlineStr"); const is=add(c,"is"); const t=add(is,"t",String(s)); t.setAttributeNS("http://www.w3.org/XML/1998/namespace","xml:space","preserve"); };
  const setNum=(ref,n)=>{ const c=cell(ref); clear(c); if(n===null||n===undefined||n===""||isNaN(n)) return; add(c,"v",String(Number(n))); };
  const setF=(ref,f,v)=>{ const c=cell(ref); clear(c); add(c,"f",f); add(c,"v",String(v)); };
  const unshare=(ref)=>{
    const c=cell(ref), f=c.getElementsByTagNameNS(NS,"f")[0]; if(!f||f.getAttribute("t")!=="shared"||!f.hasAttribute("ref")) return;
    const m=/^([A-Z]+)(\d+)$/.exec(ref), col=m[1], row=Number(m[2]); const end=f.getAttribute("ref").split(":")[1]; const endRow=Number(end.replace(/[A-Z]+/,""));
    if(endRow<=row) return;
    const nf=cell(col+(row+1)).getElementsByTagNameNS(NS,"f")[0]; if(!nf) return;
    nf.textContent=f.textContent.replace(/([A-Z]+)(\d+)/g,(x,cl,rn)=>Number(rn)===row?cl+(row+1):x);
    nf.setAttribute("ref",`${col}${row+1}:${end}`);
  };

  // 見出し
  const i=S.info;
  setStr("A2",(i.customer||"").trim()); setStr("A4",(i.site||"").trim()); setStr("A5",(i.title||"").trim());
  setStr("J1",(i.date||today()).trim()); if(i.staff) setStr("I4",i.staff); setStr("I5",(i.contact||"").trim());

  // 明細（10行目から）
  let r=10;
  for(const it of rowsFor()){
    setStr("A"+r,it.A); setStr("B"+r,it.B||""); setNum("C"+r,it.C); setStr("D"+r,it.D||"");
    setStr("J"+r,it.J||""); if(it.L!==null&&it.L!==undefined) setNum("L"+r,it.L); r++;
  }
  const lastItem=Math.max(r-1,10);
  [["合計",`SUM(I10:I${lastItem})`,0],["消費税",`ROUNDDOWN(I${r}*0.1,0)`,0],["総合計",`I${r}+I${r+1}`,0]].forEach(([lb,f,v],k)=>{
    const rr=r+k; setStr("A"+rr,lb); unshare("I"+rr); setF("I"+rr,f,v); });
  r+=4;
  // A列の幅に収まるように、長い行は折り返して次の行へ（文字が縮まないように）
  const wrap=(s,max)=>{ const out=[]; let cur="",w=0;
    for(const ch of s){ const cw=/[\u0000-ÿ｡-ﾟ]/.test(ch)?0.5:1;
      if(w+cw>max){ out.push(cur); cur="　"; w=1; } cur+=ch; w+=cw; }
    if(cur.trim()) out.push(cur); return out; };
  for(const line of memoLines()) for(const part of wrap(line,20)){ setStr("A"+r,part); r++; }
  const last=r-1;

  let xml=new XMLSerializer().serializeToString(doc);
  if(!xml.startsWith("<?xml")) xml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+xml;
  zip.file(sheetPath,xml);
  let wb=await zip.file("xl/workbook.xml").async("string");
  wb=wb.replace(/<calcPr([^>]*?)\/>/,(m0,a)=>`<calcPr${a.replace(/\s*fullCalcOnLoad="[^"]*"/,"")} fullCalcOnLoad="1"/>`);
  if(last>32) wb=wb.replace(/(_xlnm\.Print_Area"[^>]*>[^<]*\$A\$1:\$P\$)\d+/,`$1${last}`);
  zip.file("xl/workbook.xml",wb);
  if(zip.file("xl/calcChain.xml")){
    zip.remove("xl/calcChain.xml");
    zip.file("xl/_rels/workbook.xml.rels",(await zip.file("xl/_rels/workbook.xml.rels").async("string")).replace(/<Relationship [^>]*calcChain[^>]*\/>/,""));
    zip.file("[Content_Types].xml",(await zip.file("[Content_Types].xml").async("string")).replace(/<Override [^>]*calcChain[^>]*\/>/,""));
  }
  return zip.generateAsync({type:"blob",compression:"DEFLATE",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
